<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Play favorite key</title>
  <link rel="stylesheet" href="pi-theme.css" />
  <link rel="stylesheet" href="soc.css" />
  <script src="locales.generated.js"></script>
  <script src="pi.js"></script>
</head>

<body hidden>
  <pi-section title="pi.sonos_device">
    <pi-select setting="deviceIp" source="sonos-devices" with="device" placeholder="pi.choose_device"></pi-select>
    <!-- Only while setting up: a speaker that discovery doesn't find (e.g. another VLAN) -->
    <div data-show-when="deviceIp=">
      <pi-field setting="lastKnownDeviceIp" global label="pi.manual_ip_summary" placeholder="192.168.1.42" hint="pi.manual_ip_hint"></pi-field>
    </div>
  </pi-section>
  <pi-section title="pi.favorite">
    <pi-select setting="favorite" source="sonos-favorites" placeholder="pi.choose_favorite"></pi-select>
    <pi-toggle setting="showTitle" label="pi.show_title"></pi-toggle>
  </pi-section>
  <pi-section title="pi.fade">
    <pi-choice setting="fadeDuration" default="0" columns="5" label="pi.fade" data-options='[
      {"value":"0","label":"pi.fade_off"},
      {"value":"2","label":"2 s"},
      {"value":"3","label":"3 s"},
      {"value":"5","label":"5 s"},
      {"value":"8","label":"8 s"}
    ]'></pi-choice>
    <div class="pi-hint" data-i18n="pi.fade_hint"></div>
  </pi-section>
  <div class="pi-footer"><span data-plugin-version></span></div>
</body>

</html>
