<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Play/Pause key</title>
  <link rel="stylesheet" href="pi-theme.css" />
  <link rel="stylesheet" href="soc.css" />
  <script src="locales.generated.js"></script>
  <script src="pi.js"></script>
</head>

<body hidden>
  <pi-section title="pi.sonos_device">
    <pi-select setting="deviceIp" source="sonos-players" with="device" placeholder="pi.choose_device"></pi-select>
    <!-- Only while setting up: a speaker that discovery doesn't find (e.g. another VLAN) -->
    <div data-show-when="deviceIp=">
      <pi-field setting="lastKnownDeviceIp" global label="pi.manual_ip_summary" placeholder="192.168.1.42" hint="pi.manual_ip_hint"></pi-field>
    </div>
  </pi-section>
  <pi-section title="pi.display">
    <pi-toggle setting="showCoverArt" label="pi.show_cover" data-default="true"></pi-toggle>
    <pi-toggle setting="showTrackTitle" label="pi.show_track_title"></pi-toggle>
    <pi-toggle setting="showProgress" label="pi.show_progress"></pi-toggle>
    <pi-toggle setting="showDeviceName" label="pi.show_device_name"></pi-toggle>
    <pi-range setting="fontSize" min="10" max="20" step="1" default="13" unit=" px" label="pi.font_size"></pi-range>
    <pi-color setting="fontColor" default="#FFFFFF" label="pi.font_color"></pi-color>
  </pi-section>
  <pi-section title="kit.key_color">
    <pi-key-color setting="keyColor" label=""></pi-key-color>
  </pi-section>
  <pi-section title="pi.battery" data-show-when="hasBattery=true">
    <pi-choice setting="batteryDisplayMode" default="warning" columns="3" data-options='[
      {"value":"off","label":"pi.battery_off"},
      {"value":"warning","label":"pi.battery_warning"},
      {"value":"full","label":"pi.battery_full"}
    ]'></pi-choice>
  </pi-section>
  <pi-section class="pi-win" title="kit.call_title">
    <pi-call-reaction></pi-call-reaction>
  </pi-section>
  <pi-more></pi-more>
  <div class="pi-footer"><span data-plugin-version></span></div>
</body>

</html>
