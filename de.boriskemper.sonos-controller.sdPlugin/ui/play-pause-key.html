<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Play/Pause key</title>
  <link rel="stylesheet" href="pi-theme.css" />
  <link rel="stylesheet" href="soc.css" />
  <script src="locales.generated.js"></script>
  <script src="pi.js"></script>
</head>

<body hidden>
  <pi-section title="pi.sonos_device" data-player-section>
    <pi-select setting="player" source="players" placeholder="kit.player_active"></pi-select>
  </pi-section>
  <pi-section title="pi.display">
    <pi-toggle setting="showCover" label="pi.show_cover" data-default="true"></pi-toggle>
    <pi-toggle setting="showTitle" label="pi.show_track_title"></pi-toggle>
    <pi-toggle setting="showProgress" label="pi.show_progress"></pi-toggle>
    <pi-toggle setting="showName" label="pi.show_device_name"></pi-toggle>
  </pi-section>
  <pi-section title="kit.corners_title">
    <pi-corners default-left="marker" default-right="source"></pi-corners>
  </pi-section>
  <pi-section title="kit.key_color">
    <pi-key-color setting="keyColor" label=""></pi-key-color>
  </pi-section>
  <pi-section class="pi-win" title="kit.call_title">
    <pi-call-reaction></pi-call-reaction>
  </pi-section>
  <pi-more></pi-more>
  <div class="pi-footer"><span data-plugin-version></span></div>
</body>

</html>
