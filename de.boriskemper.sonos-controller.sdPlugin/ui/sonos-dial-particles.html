<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Panorama Effects Settings</title>
    <script src="i18n.js" defer></script>
    <script src="sdpi-components.js" defer></script>
    <style>
      :root { color-scheme: dark; }
      .hidden { display: none !important; }
    </style>
  </head>

  <body>
    <sdpi-item id="deviceItem" label="SONOS device" data-i18n="sonos_device">
      <sdpi-select id="deviceSelect" setting="deviceIp" datasource="get-devices" loading="Fetching devices…" data-i18n-loading="fetching_devices" hot-reload>
      </sdpi-select>
    </sdpi-item>

    <sdpi-item label="Effect" data-i18n="effect">
      <sdpi-select id="effectSelect" setting="effectId" datasource="get-effects"></sdpi-select>
    </sdpi-item>

    <!-- Particles-specific settings -->
    <sdpi-item id="colorItem" label="Particle color" data-i18n="particle_color">
      <sdpi-color setting="staticColor"></sdpi-color>
    </sdpi-item>

    <sdpi-item id="trackInfoItem" label="Track info" data-i18n="track_info">
      <sdpi-checkbox setting="showTrackInfo"></sdpi-checkbox>
    </sdpi-item>

    <!-- Boing Ball-specific settings -->
    <sdpi-item id="primaryColorItem" label="Primary color" data-i18n="primary_color" class="hidden">
      <sdpi-color id="primaryColorInput" setting="primaryColor" value="#87AE73"></sdpi-color>
    </sdpi-item>

    <sdpi-item id="secondaryColorItem" label="Secondary color" data-i18n="secondary_color" class="hidden">
      <sdpi-color id="secondaryColorInput" setting="secondaryColor" value="#FFFFFF"></sdpi-color>
    </sdpi-item>

    <sdpi-item id="resetColorsItem" class="hidden">
      <sdpi-button id="resetColorsBtn" data-i18n-html="reset_colors">Reset colors</sdpi-button>
    </sdpi-item>

    <script>
      var colorItem = document.getElementById('colorItem');
      var primaryColorItem = document.getElementById('primaryColorItem');
      var secondaryColorItem = document.getElementById('secondaryColorItem');
      var resetColorsItem = document.getElementById('resetColorsItem');
      var effectSelect = document.getElementById('effectSelect');
      var deviceSelect = document.getElementById('deviceSelect');
      var primaryColorInput = document.getElementById('primaryColorInput');
      var secondaryColorInput = document.getElementById('secondaryColorInput');
      var resetColorsBtn = document.getElementById('resetColorsBtn');

      var BOING_BALL_DEFAULT_PRIMARY = '#87AE73';
      var BOING_BALL_DEFAULT_SECONDARY = '#FFFFFF';

      var currentEffectId = 'particles';
      var currentDeviceIp = '';

      function updateVisibility() {
        var isParticles = currentEffectId === 'particles' || !currentEffectId;
        // Particle color only makes sense when there's no device driving the ambient color.
        colorItem.classList.toggle('hidden', !isParticles || !!currentDeviceIp);

        var isBoingBall = currentEffectId === 'boing-ball';
        primaryColorItem.classList.toggle('hidden', !isBoingBall);
        secondaryColorItem.classList.toggle('hidden', !isBoingBall);
        resetColorsItem.classList.toggle('hidden', !isBoingBall);
      }

      // sdpi-components elements fire a non-bubbling "valuechange" event directly on themselves
      // whenever their .value is set — both from user interaction AND from the initial settings
      // sync on PI load — so listening here (rather than for a bubbled "change"/"settingsDidChange"
      // on document, which this library never dispatches) is what actually keeps this in sync.
      effectSelect.addEventListener('valuechange', () => {
        currentEffectId = effectSelect.value || 'particles';
        updateVisibility();
      });
      deviceSelect.addEventListener('valuechange', () => {
        currentDeviceIp = deviceSelect.value || '';
        updateVisibility();
      });

      // sdpi-color's template binds the native <input type="color"> via .defaultValue, not
      // .value — the browser only honors defaultValue before the input is "dirty" (i.e. on
      // first render), so setting the wrapper's .value alone persists the new setting fine but
      // never updates the visible swatch. Reach into its shadow DOM and set the native input's
      // live .value directly so the PI reflects the reset immediately.
      function setColorValue(sdpiColorEl, hex) {
        sdpiColorEl.value = hex;
        sdpiColorEl.dispatchEvent(new InputEvent('input', { bubbles: true }));
        var nativeInput = sdpiColorEl.shadowRoot && sdpiColorEl.shadowRoot.querySelector('input[type="color"]');
        if (nativeInput) nativeInput.value = hex;
      }

      // "click" is a native UI event (composed: true), so it crosses the sdpi-button's shadow
      // boundary fine — unlike "change"/"valuechange", no special wiring needed here.
      resetColorsBtn.addEventListener('click', () => {
        setColorValue(primaryColorInput, BOING_BALL_DEFAULT_PRIMARY);
        setColorValue(secondaryColorInput, BOING_BALL_DEFAULT_SECONDARY);
      });
    </script>
  </body>
</html>
