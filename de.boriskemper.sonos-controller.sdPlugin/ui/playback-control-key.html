<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Playback control key</title>
  <link rel="stylesheet" href="pi-theme.css" />
  <link rel="stylesheet" href="soc.css" />
  <script src="locales.generated.js"></script>
  <script src="pi.js"></script>
</head>

<body hidden>
  <pi-section title="pi.sonos_device">
    <pi-select setting="deviceIp" source="sonos-devices" with="device" placeholder="pi.choose_device"></pi-select>
    <!-- Only while setting up: a speaker that discovery doesn't find (e.g. another VLAN) -->
    <div data-show-when="deviceIp=">
      <pi-field setting="lastKnownDeviceIp" global label="pi.manual_ip_summary" placeholder="192.168.1.42" hint="pi.manual_ip_hint"></pi-field>
    </div>
  </pi-section>
  <pi-section title="pi.command">
    <pi-choice setting="command" columns="4" data-options='[
      {"value":"previous","label":"pi.cmd_previous","icon":"previous"},
      {"value":"next","label":"pi.cmd_next","icon":"next"},
      {"value":"shuffle","label":"pi.cmd_shuffle","icon":"shuffle"},
      {"value":"repeat","label":"pi.cmd_repeat","icon":"repeat"}
    ]'></pi-choice>
  </pi-section>
  <div class="pi-footer"><span data-plugin-version></span></div>
</body>

</html>
