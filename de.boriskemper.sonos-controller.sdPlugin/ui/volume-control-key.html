<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Volume control key</title>
  <link rel="stylesheet" href="pi-theme.css" />
  <link rel="stylesheet" href="soc.css" />
  <script src="locales.generated.js"></script>
  <script src="pi.js"></script>
</head>

<body hidden>
  <pi-section title="pi.sonos_device" data-player-section>
    <pi-select setting="player" source="players" placeholder="kit.player_active"></pi-select>
  </pi-section>
  <pi-section title="pi.command">
    <pi-choice setting="command" default="up" columns="4" data-options='[
      {"value":"mute","label":"pi.cmd_mute","icon":"volumeOff"},
      {"value":"down","label":"pi.cmd_vol_down","icon":"volumeDown"},
      {"value":"up","label":"pi.cmd_vol_up","icon":"volumeUp"},
      {"value":"preset","label":"pi.cmd_vol_preset","icon":"volumeMedium"}
    ]'></pi-choice>
    <pi-range setting="step" min="1" max="20" step="1" default="5" unit="%" label="pi.vol_step" data-show-when="command=up,down" data-show-default="up"></pi-range>
    <pi-range setting="preset" min="0" max="100" step="1" default="20" unit="%" label="pi.preset_volume"></pi-range>
    <div class="pi-hint" data-show-when="command=mute,up,down" data-show-default="up" data-i18n="pi.preset_long_press_hint"></div>
  </pi-section>
  <pi-section data-show-when="command=mute" title="pi.gauge">
    <pi-choice setting="gauge" default="ring" columns="3" data-options='[
      {"value":"pie","label":"pi.gauge_pie","icon":"gaugePie"},
      {"value":"ring","label":"pi.gauge_ring","icon":"gaugeRing"},
      {"value":"open","label":"pi.gauge_open","icon":"gaugeOpen"}
    ]'></pi-choice>
  </pi-section>
  <pi-section title="pi.display">
    <pi-toggle setting="showVolume" label="pi.show_volume" data-default="true"></pi-toggle>
  </pi-section>
  <pi-section title="kit.key_color">
    <pi-key-color setting="keyColor" label=""></pi-key-color>
  </pi-section>
  <pi-section class="pi-win" title="kit.call_title">
    <pi-call-reaction></pi-call-reaction>
  </pi-section>
  <pi-more></pi-more>
  <div class="pi-footer"><span data-plugin-version></span></div>
</body>

</html>
