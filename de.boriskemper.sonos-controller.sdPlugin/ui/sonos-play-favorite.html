<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SONOS Play Favorite Settings</title>
    <script src="i18n.js" defer></script>
    <script src="sdpi-components.js" defer></script>
    <style>
      :root { color-scheme: dark; }
      .hint { font-size: 11px; color: #888; line-height: 1.4; }
    </style>
  </head>

  <body>
    <sdpi-item label="SONOS device" data-i18n="sonos_device">
        <sdpi-select id="device-select" setting="deviceIp" datasource="get-devices" loading="Fetching devices…" data-i18n-loading="fetching_devices" hot-reload>
            <option value="" data-i18n="choose_device">-- Choose Device --</option>
        </sdpi-select>
    </sdpi-item>

    <sdpi-item label="Favorite" data-i18n="favorite">
        <sdpi-select id="favorite-select" setting="favorite" datasource="get-favorites" loading="Fetching favorites…" data-i18n-loading="fetching_favorites" hot-reload>
            <option value="" data-i18n="choose_favorite">-- Choose Favorite --</option>
        </sdpi-select>
    </sdpi-item>

    <sdpi-item label="Show title" data-i18n="show_title">
      <sdpi-checkbox setting="showTitle"></sdpi-checkbox>
    </sdpi-item>

    <sdpi-item label="Fade out" data-i18n="fade_out">
      <sdpi-select setting="fadeDuration">
        <option value="0" data-i18n="fade_off">Off</option>
        <option value="2">2 s</option>
        <option value="3">3 s</option>
        <option value="5">5 s</option>
        <option value="8">8 s</option>
      </sdpi-select>
    </sdpi-item>

    <sdpi-item>
      <sdpi-item-value class="hint" data-i18n-html="fade_hint">
        Fades the current track out before starting this favorite, then fades the new one back in.
      </sdpi-item-value>
    </sdpi-item>

    <script>
      let deviceSelect, favoriteSelect;

      function updateFavoriteState() {
        if (deviceSelect && favoriteSelect) {
            // A device must be selected to enable favorite selection.
            const isDeviceSelected = deviceSelect.value && deviceSelect.value !== "";
            favoriteSelect.disabled = !isDeviceSelected;
        }
      }

      window.addEventListener('connected', (ev) => {
        // This is called when the PI is connected to the Stream Deck software.
        // It's the best time to get references to elements and check initial state.
        deviceSelect = document.getElementById('device-select');
        favoriteSelect = document.getElementById('favorite-select');
        
        // Set up the listener for when the user changes the device.
        deviceSelect.addEventListener('change', updateFavoriteState);

        // Check the initial state when the PI is loaded.
        // A timeout helps ensure that the initial settings have been applied.
        setTimeout(updateFavoriteState, 100);
      });
    </script>
  </body>
</html>
