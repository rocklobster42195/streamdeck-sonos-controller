<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Track control dial</title>
  <link rel="stylesheet" href="pi-theme.css" />
  <link rel="stylesheet" href="soc.css" />
  <script src="locales.generated.js"></script>
  <script src="pi.js"></script>
</head>

<body hidden>
  <pi-section title="pi.sonos_device">
    <pi-select setting="deviceIp" source="sonos-devices" with="device" placeholder="pi.choose_device"></pi-select>
    <!-- Only while setting up: a speaker that discovery doesn't find (e.g. another VLAN) -->
    <div data-show-when="deviceIp=">
      <pi-field setting="lastKnownDeviceIp" global label="pi.manual_ip_summary" placeholder="192.168.1.42" hint="pi.manual_ip_hint"></pi-field>
    </div>
  </pi-section>
  <pi-section title="pi.look">
    <pi-choice setting="visualizerMode" default="eq" columns="2" data-options='[
      {"value":"none","label":"pi.look_track_info","icon":"trackInfo"},
      {"value":"eq","label":"pi.look_eq","icon":"eq"}
    ]'></pi-choice>
    <div class="pi-hint" data-i18n="pi.look_hint"></div>
  </pi-section>
  <pi-section title="pi.battery" data-show-when="hasBattery=true">
    <pi-choice setting="batteryDisplayMode" default="warning" columns="3" data-options='[
      {"value":"off","label":"pi.battery_off"},
      {"value":"warning","label":"pi.battery_warning"},
      {"value":"full","label":"pi.battery_full"}
    ]'></pi-choice>
  </pi-section>
  <pi-panorama class="pi-win"></pi-panorama>
  <pi-panorama class="pi-pi-only" summary></pi-panorama>
  <pi-more></pi-more>
  <div class="pi-footer"><span data-plugin-version></span></div>
</body>

</html>
