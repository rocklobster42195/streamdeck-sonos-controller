<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Group volume dial</title>
  <link rel="stylesheet" href="pi-theme.css" />
  <link rel="stylesheet" href="soc.css" />
  <script src="locales.generated.js"></script>
  <script src="pi.js"></script>
</head>

<body hidden>
  <pi-section title="pi.sonos_group">
    <pi-select setting="groupIp" source="sonos-groups" with="group" placeholder="pi.choose_group"></pi-select>
  </pi-section>
  <pi-section title="pi.gauge">
    <pi-choice setting="gauge" default="pie" columns="3" data-options='[
      {"value":"pie","label":"pi.gauge_pie","icon":"gaugePie"},
      {"value":"ring","label":"pi.gauge_ring","icon":"gaugeRing"},
      {"value":"open","label":"pi.gauge_open","icon":"gaugeOpen"}
    ]'></pi-choice>
    <div data-show-when="gauge=ring,open">
      <pi-icon-picker setting="icon" none-label="pi.icon_none" reset-label="pi.icon_remove" hint="pi.icon_hint"></pi-icon-picker>
    </div>
  </pi-section>
  <pi-section title="pi.display">
    <pi-toggle setting="showText" label="pi.show_text" data-default="true"></pi-toggle>
    <pi-choice setting="align" default="left" columns="3" data-options='[
      {"value":"left","label":"pi.align_left","icon":"alignLeft"},
      {"value":"center","label":"pi.align_center","icon":"alignCenter"},
      {"value":"right","label":"pi.align_right","icon":"alignRight"}
    ]'></pi-choice>
  </pi-section>
  <pi-panorama class="pi-win"></pi-panorama>
  <pi-panorama class="pi-pi-only" summary></pi-panorama>
  <pi-section class="pi-win" title="kit.call_title">
    <pi-call-reaction></pi-call-reaction>
  </pi-section>
  <pi-more></pi-more>
  <div class="pi-footer"><span data-plugin-version></span></div>
</body>

</html>
