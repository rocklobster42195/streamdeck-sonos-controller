<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SONOS Dial Group Volume Settings</title>
    <script src="i18n.js" defer></script>
    <script src="sdpi-components.js" defer></script>
    <script src="effect-fields.js" defer></script>
    <style>
        :root { color-scheme: dark; }
    </style>
  </head>

  <body>
    <sdpi-item label="SONOS Group" data-i18n="sonos_group">
        <sdpi-select setting="groupIp" datasource="get-groups" loading="Fetching groups…" data-i18n-loading="fetching_groups" hot-reload>
        </sdpi-select>
    </sdpi-item>
    <sdpi-item>
        <sdpi-item-value style="font-size:11px; color:#888; line-height:1.4" data-i18n-html="group_preset_hint">
            Long-press the touch strip to save every speaker's current volume as a preset.<br>
            Tap to recall it.
        </sdpi-item-value>
    </sdpi-item>
    <sdpi-item label="Show text" data-i18n="show_text">
        <sdpi-checkbox id="showTextCheckbox" setting="showText"></sdpi-checkbox>
    </sdpi-item>
    <sdpi-item label="Alignment" data-i18n="alignment">
        <sdpi-select setting="align" datasource="get-align-options"></sdpi-select>
    </sdpi-item>
    <sdpi-item label="Background" data-i18n="background">
        <sdpi-select id="vizSelect" setting="visualizerMode" datasource="get-viz-options"></sdpi-select>
    </sdpi-item>
    <div id="effectFieldsContainer"></div>

    <script>
        // `value` is set as a JS property, not an HTML attribute — sdpi-components' setting-
        // binding mixin declares `value` with `attribute: false`, so a plain HTML attribute has
        // no effect. Pre-seeds the "unset" (brand new tile, no saved showText yet) case to match
        // this dial's own render default (`settings?.showText ?? true` in
        // group-volume-dial.ts) — without this the PI checkbox showed unchecked while the
        // dial itself already rendered the % text, since a checkbox's own unset default is
        // unchecked/false. A previously saved value (true or false) still overrides this once the
        // real settings sync arrives.
        document.getElementById('showTextCheckbox').value = true;

        // sdpi-components fires the non-bubbling "valuechange" event directly on the element
        // whenever its .value is set — both from user interaction AND from the initial settings
        // sync on PI load — so this single listener covers first render and every later switch.
        var vizSelect = document.getElementById('vizSelect');
        var effectFieldsContainer = document.getElementById('effectFieldsContainer');
        vizSelect.addEventListener('valuechange', function () {
            window.renderEffectFields(effectFieldsContainer, vizSelect.value);
        });
    </script>
  </body>
</html>
