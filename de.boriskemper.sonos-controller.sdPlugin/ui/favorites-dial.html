<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Favorites dial</title>
  <link rel="stylesheet" href="pi-theme.css" />
  <link rel="stylesheet" href="soc.css" />
  <script src="locales.generated.js"></script>
  <script src="pi.js"></script>
</head>

<body hidden>
  <pi-section title="pi.sonos_device">
    <pi-select setting="deviceIp" source="sonos-devices" with="device" placeholder="pi.choose_device"></pi-select>
    <!-- Only while setting up: a speaker that discovery doesn't find (e.g. another VLAN) -->
    <div data-show-when="deviceIp=">
      <pi-field setting="lastKnownDeviceIp" global label="pi.manual_ip_summary" placeholder="192.168.1.42" hint="pi.manual_ip_hint"></pi-field>
    </div>
  </pi-section>
  <pi-section title="pi.list">
    <pi-toggle setting="showCovers" label="pi.show_covers" data-default="true"></pi-toggle>
    <div data-show-when="hasLineIn=true">
      <pi-toggle setting="includeLineIn" label="pi.include_line_in"></pi-toggle>
    </div>
    <pi-range setting="browseTimeout" min="1" max="10" step="1" default="3" unit=" s" label="pi.back_after_idle"></pi-range>
  </pi-section>
  <pi-section title="pi.fade">
    <pi-choice setting="fadeDuration" default="0" columns="5" label="pi.fade" data-options='[
      {"value":"0","label":"pi.fade_off"},
      {"value":"2","label":"2 s"},
      {"value":"3","label":"3 s"},
      {"value":"5","label":"5 s"},
      {"value":"8","label":"8 s"}
    ]'></pi-choice>
    <div class="pi-hint" data-i18n="pi.fade_hint"></div>
  </pi-section>
  <pi-section title="pi.heart_position">
    <pi-choice setting="align" default="center" columns="3" data-options='[
      {"value":"left","label":"pi.align_left","icon":"alignLeft"},
      {"value":"center","label":"pi.align_center","icon":"alignCenter"},
      {"value":"right","label":"pi.align_right","icon":"alignRight"}
    ]'></pi-choice>
    <div class="pi-hint" data-i18n="pi.heart_hint"></div>
  </pi-section>
  <pi-panorama class="pi-win"></pi-panorama>
  <pi-panorama class="pi-pi-only" summary></pi-panorama>
  <pi-more></pi-more>
  <div class="pi-footer"><span data-plugin-version></span></div>
</body>

</html>
