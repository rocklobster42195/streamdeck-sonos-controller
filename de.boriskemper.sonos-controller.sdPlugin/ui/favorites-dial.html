<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Favorites Dial Settings</title>
  <script src="i18n.js" defer></script>
  <script src="sdpi-components.js" defer></script>
  <script src="effect-fields.js" defer></script>
  <style>
    :root { color-scheme: dark; }
    .hint { font-size: 11px; color: #888; line-height: 1.4; }
    #bt-row { display: flex; align-items: center; gap: 8px; width: 100%; }
    #btRange { flex: 1; min-width: 0; }
    #btNumber {
        width: 46px;
        background: var(--sdpi-background, #1e1e1e);
        color: var(--sdpi-color, #ccc);
        border: 1px solid var(--sdpi-borderColor, #555);
        border-radius: 3px;
        padding: 3px 4px;
        text-align: center;
        font-size: 12px;
        font-family: inherit;
    }
    #btNumber:focus { outline: none; border-color: var(--sdpi-focusColor, #888); }
  </style>
</head>
<body>
  <sdpi-item label="SONOS device" data-i18n="sonos_device">
    <sdpi-select setting="deviceIp" datasource="get-devices" loading="Fetching devices…" data-i18n-loading="fetching_devices" hot-reload>
    </sdpi-select>
  </sdpi-item>

  <sdpi-item label="Browse timeout" data-i18n="browse_timeout">
    <div id="bt-row">
      <sdpi-range id="btRange" setting="browseTimeout" min="1" max="10" step="1" value="3"></sdpi-range>
      <input type="number" id="btNumber" min="1" max="10" step="1" title="Browse timeout">
    </div>
  </sdpi-item>

  <!-- Options come from the plugin (get-fade-options) like every other working select in this
       plugin — a static <option> list left the control stuck/unopenable in the SD webview. -->
  <sdpi-item label="Fade out" data-i18n="fade_out">
    <sdpi-select setting="fadeDuration" datasource="get-fade-options"></sdpi-select>
  </sdpi-item>

  <sdpi-item>
    <sdpi-item-value class="hint" data-i18n-html="fade_hint">
      Fades the whole group out before starting the chosen favorite, then restores each speaker's volume.
    </sdpi-item-value>
  </sdpi-item>

  <sdpi-item label="Background" data-i18n="background">
    <sdpi-select id="vizSelect" setting="visualizerMode" datasource="get-viz-options"></sdpi-select>
  </sdpi-item>
  <sdpi-item id="alignItem" label="Alignment" data-i18n="alignment">
    <sdpi-select setting="align" datasource="get-align-options"></sdpi-select>
  </sdpi-item>
  <div id="effectFieldsContainer"></div>

  <sdpi-item>
    <sdpi-item-value class="hint" data-i18n-html="fav_hint">
      Rotate to browse all your Sonos favorites.<br>
      Press to play. Touch or wait to return to now playing.
    </sdpi-item-value>
  </sdpi-item>

  <script>
    var btRange = document.getElementById('btRange');
    var btNumber = document.getElementById('btNumber');

    btRange.addEventListener('valuechange', function (e) {
        btNumber.value = e.target.value;
    });

    btNumber.addEventListener('change', function () {
        var n = Math.max(1, Math.min(10, parseInt(btNumber.value) || 3));
        btNumber.value = n;
        btRange.value = n;
        btRange.dispatchEvent(new InputEvent('input', { bubbles: true }));
    });

    // 'mosaic' has no icon to align and no effect fields — hide both extras for it.
    var vizSelect = document.getElementById('vizSelect');
    var alignItem = document.getElementById('alignItem');
    var effectFieldsContainer = document.getElementById('effectFieldsContainer');
    vizSelect.addEventListener('valuechange', function () {
        var isIconMode = vizSelect.value && vizSelect.value !== 'mosaic';
        alignItem.hidden = !isIconMode;
        window.renderEffectFields(effectFieldsContainer, vizSelect.value);
    });
  </script>
</body>
</html>
