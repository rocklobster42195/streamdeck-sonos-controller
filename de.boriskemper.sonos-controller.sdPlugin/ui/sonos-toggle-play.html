<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Play Key Settings</title>
  <script src="i18n.js" defer></script>
  <script src="sdpi-components.js" defer></script>
  <script src="battery-capability.js" defer></script>
  <style>
    :root { color-scheme: dark; }
    .hidden { display: none !important; }
  </style>
</head>

<body>
  <sdpi-item label="SONOS device" data-i18n="sonos_device">
    <sdpi-select id="deviceSelect" setting="deviceIp" datasource="get-devices" loading="Fetching devices…" data-i18n-loading="fetching_devices" hot-reload>
    </sdpi-select>
  </sdpi-item>
  <sdpi-item label="Device Name" data-i18n="device_name">
    <sdpi-checkbox setting="showDeviceName" value="true"></sdpi-checkbox>
  </sdpi-item>
  <sdpi-item label="Cover Art" data-i18n="cover_art">
    <sdpi-checkbox setting="showCoverArt" value="true"></sdpi-checkbox>
  </sdpi-item>
  <sdpi-item label="Progress" data-i18n="show_progress">
    <sdpi-checkbox setting="showProgress"></sdpi-checkbox>
  </sdpi-item>
  <sdpi-item label="Title (Artist)" data-i18n="title_artist">
    <sdpi-checkbox setting="showTrackTitle" value="true"></sdpi-checkbox>
  </sdpi-item>
  <sdpi-item label="FontSize" data-i18n="font_size">
    <sdpi-range setting="fontSize" min="10" max="20" step="1" showlabels></sdpi-range>
  </sdpi-item>
  <sdpi-item label="FontColor" data-i18n="font_color">
    <sdpi-color setting="fontColor"></sdpi-color>
  </sdpi-item>

  <sdpi-item id="batteryItem" class="hidden" label="Battery" data-i18n="battery_mode">
    <sdpi-select setting="batteryDisplayMode" datasource="get-battery-mode-options"></sdpi-select>
  </sdpi-item>
  <sdpi-checkbox id="hasBatteryCheckbox" setting="hasBattery" class="hidden"></sdpi-checkbox>

  <script>
    // Wrapped in DOMContentLoaded (not relying on this being a `defer` script) because the
    // Stream Deck PI webview does not reliably defer inline <script> tags — an inline
    // `<script defer>` here could still run before battery-capability.js (a real deferred
    // *external* script) has executed, throwing "window.wireBatteryCapability is not a
    // function". DOMContentLoaded always fires after every deferred external script is done.
    document.addEventListener('DOMContentLoaded', function () {
        window.wireBatteryCapability(document.getElementById('hasBatteryCheckbox'), document.getElementById('batteryItem'));
    });
  </script>
</body>

</html>
