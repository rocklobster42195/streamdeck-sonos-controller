<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Panorama effects dial</title>
  <link rel="stylesheet" href="pi-theme.css" />
  <link rel="stylesheet" href="soc.css" />
  <script src="locales.generated.js"></script>
  <script src="pi.js"></script>
</head>

<body hidden>
  <pi-section title="pi.sonos_device" data-player-section>
    <pi-select setting="player" source="players" placeholder="kit.player_active"></pi-select>
  </pi-section>
  <pi-section title="pi.display">
    <pi-toggle setting="showTrackInfo" label="pi.show_track_info" hint="pi.show_track_info_hint"></pi-toggle>
  </pi-section>
  <pi-panorama class="pi-win"></pi-panorama>
  <pi-panorama class="pi-pi-only" summary></pi-panorama>
  <pi-more></pi-more>
  <div class="pi-footer"><span data-plugin-version></span></div>
</body>

</html>
