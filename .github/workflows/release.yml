name: Release

on:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Pack plugin
        run: npx streamdeck pack de.boriskemper.sonos-controller.sdPlugin --force

      - name: Rename package with version
        # streamdeck pack always names the output after the plugin UUID, not the version — stable
        # and beta releases would otherwise both produce an identically-named .streamDeckPlugin,
        # which collides once downloaded locally (can't tell them apart, one silently overwrites
        # the other).
        run: mv de.boriskemper.sonos-controller.streamDeckPlugin "de.boriskemper.sonos-controller-${{ github.event.release.tag_name }}.streamDeckPlugin"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: de.boriskemper.sonos-controller-*.streamDeckPlugin
